<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Task Manager</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #20243a;
        }

        .container {
            width: min(900px, 92%);
            margin: 55px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            color: #5b55e7;
        }

        .subtitle {
            color: #777d91;
            margin-top: 8px;
        }

        .panel {
            background: white;
            padding: 26px;
            border-radius: 18px;
            box-shadow: 0 10px 35px #20243a0b;
            margin-bottom: 22px;
        }

        h2 {
            margin-top: 0;
            font-size: 19px;
        }

        form {
            display: grid;
            gap: 13px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #e1e4ef;
            border-radius: 10px;
            font: inherit;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #7770f3;
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 17px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .add-btn {
            background: #5b55e7;
            color: white;
        }

        .add-btn:hover {
            background: #4740d1;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            flex: 1;
            padding: 17px;
            border-radius: 13px;
            background: #f0efff;
        }

        .stat span {
            display: block;
            color: #777d91;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 24px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 17px 0;
            border-bottom: 1px solid #edf0f5;
        }

        .task:last-child {
            border-bottom: 0;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .task-description {
            color: #777d91;
            font-size: 14px;
            margin-top: 6px;
            overflow-wrap: anywhere;
        }

        .completed .task-title {
            text-decoration: line-through;
            color: #999;
        }

        .task input[type="checkbox"] {
            width: 19px;
            height: 19px;
            accent-color: #5b55e7;
            cursor: pointer;
        }

        .delete-btn {
            background: #fff0f0;
            color: #d44848;
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            color: #777d91;
        }

        #message {
            margin-bottom: 15px;
            color: #d44848;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #8b90a2;
            font-size: 13px;
            padding: 15px;
        }

        @media (max-width: 560px) {
            .container {
                margin: 28px auto;
            }

            .panel {
                padding: 18px;
            }

            .task {
                flex-wrap: wrap;
            }
            .delete-btn {
                margin-left: auto;
            }

            .stats {
                gap: 8px;
            }

            .stat {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <div>
                <div class="logo">TaskFlow.</div>
                <div class="subtitle">Organize your day, one task at a time.</div>
            </div>
        </header>

        <section class="panel">
            <h2>Create a new task</h2>

            <form id="taskForm">
                <input
                    id="title"
                    type="text"
                    placeholder="What needs to be done?"
                    maxlength="255"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Add a description (optional)"
                ></textarea>

                <button class="add-btn" type="submit">+ Add Task</button>
            </form>
        </section>

        <section class="panel">
            <h2>Your tasks</h2>

            <div class="stats">
                <div class="stat">
                    <span>Total Tasks</span>
                    <strong id="total">0</strong>
                </div>

                <div class="stat">
                    <span>Completed</span>
                    <strong id="completed">0</strong>
                </div>

                <div class="stat">
                    <span>Remaining</span>
                    <strong id="remaining">0</strong>
                </div>
            </div>

            <div id="message" role="status" aria-live="polite"></div>
            <div id="taskList">
                <div class="empty">Loading tasks...</div>
            </div>
        </section>

        <footer class="footer">
            TaskFlow — Simple, focused, productive.
        </footer>
    </main>

    <script>
        const API_URL = "api.php";
        const taskForm = document.getElementById("taskForm");
        const titleInput = document.getElementById("title");
        const descriptionInput = document.getElementById("description");
        const taskList = document.getElementById("taskList");
        const message = document.getElementById("message");

        let tasks = [];

        function showMessage(text) {
            message.textContent = text;
        }

        async function requestApi(action, data = null) {
            const options = data === null
                ? { method: "GET" }
                : {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action, ...data })
                };

            const response = await fetch(API_URL, options);
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Something went wrong.");
            }

            return result;
        }

        function updateStats() {
            const completed = tasks.filter(
                task => Number(task.is_completed) === 1
            ).length;

            document.getElementById("total").textContent = tasks.length;
            document.getElementById("completed").textContent = completed;
            document.getElementById("remaining").textContent =
                tasks.length - completed;
        }

        function renderTasks() {
            taskList.replaceChildren();

            if (tasks.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "No tasks yet. Add your first task!";
                taskList.appendChild(empty);
                updateStats();
                return;
            }

            tasks.forEach(task => {
                const row = document.createElement("div");
                row.className = "task";
                if (Number(task.is_completed) === 1) {
                    row.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = Number(task.is_completed) === 1;
                checkbox.setAttribute(
                    "aria-label",
                    "Mark " + task.title + " as completed"
                );

                checkbox.addEventListener("change", async () => {
                    checkbox.disabled = true;
                    try {
                        await requestApi("toggle", { id: Number(task.id) });
                        await loadTasks();
                    } catch (error) {
                        showMessage(error.message);
                        checkbox.checked = !checkbox.checked;
                        checkbox.disabled = false;
                    }
                });

                const info = document.createElement("div");
                info.className = "task-info";

                const taskTitle = document.createElement("div");
                taskTitle.className = "task-title";
                taskTitle.textContent = task.title;

                info.appendChild(taskTitle);

                if (task.description) {
                    const desc = document.createElement("div");
                    desc.className = "task-description";
                    desc.textContent = task.description;
                    info.appendChild(desc);
                }

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";

                deleteButton.addEventListener("click", async () => {
                    if (!confirm("Are you sure you want to delete this task?")) {
                        return;
                    }

                    deleteButton.disabled = true;

                    try {
                        await requestApi("delete", {
                            id: Number(task.id)
                        });
                        await loadTasks();
                    } catch (error) {
                        showMessage(error.message);
                        deleteButton.disabled = false;
                    }
                });

                row.append(checkbox, info, deleteButton);
                taskList.appendChild(row);
            });

            updateStats();
        }

        async function loadTasks() {
            try {
                showMessage("");
                tasks = await requestApi("get");
                renderTasks();
            } catch (error) {
                taskList.replaceChildren();
                showMessage("Could not load tasks: " + error.message);
            }
        }

        taskForm.addEventListener("submit", async event => {
            event.preventDefault();

            const title = titleInput.value.trim();
            const description = descriptionInput.value.trim();

            if (!title) {
                showMessage("Please enter a task title.");
                return;
            }

            const submitButton = taskForm.querySelector("button");
            submitButton.disabled = true;
            showMessage("");

            try {
                await requestApi("create", { title, description });
                taskForm.reset();
                await loadTasks();
                titleInput.focus();
            } catch (error) {
                showMessage(error.message);
            } finally {
                submitButton.disabled = false;
            }
        });

        loadTasks();
    </script>
</body>
</html>
